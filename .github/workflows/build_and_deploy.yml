name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.4

      - name: Build static site
        run: jaspr build --sitemap-domain https://jemisgoti.github.io --sitemap-exclude "^/404"

      - name: Prepare GitHub Pages output
        run: |
          rm -rf build/jaspr/packages build/jaspr/.dart_tool build/jaspr/.build.manifest
          # Pages serves /work/index.html at /work/, so list the canonical trailing-slash URLs.
          sed -i -E 's#(https://jemisgoti\.github\.io/[^<]*[^/<])</loc>#\1/</loc>#' build/jaspr/sitemap.xml
          touch build/jaspr/.nojekyll
          if [ -f build/jaspr/404/index.html ]; then cp build/jaspr/404/index.html build/jaspr/404.html; fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/jaspr
